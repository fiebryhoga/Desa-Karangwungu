<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kerupukGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="kerupukOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#kerupukGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#kerupukOrange)" stroke="#ffffff" stroke-width="2" />
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#kerupukGold)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="62" fill="#fff7ed" />

  <!-- Stylized Crispy Crackers & Otak-otak shapes -->
  <ellipse cx="86" cy="98" rx="18" ry="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2" transform="rotate(-15 86 98)" />
  <ellipse cx="112" cy="104" rx="20" ry="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2" transform="rotate(20 112 104)" />
  <!-- Steam rays -->
  <path d="M85 75 Q88 68 85 62" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M100 72 Q103 65 100 58" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M115 75 Q118 68 115 62" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Ribbon / Banner -->
  <rect x="50" y="128" width="100" height="18" rx="4" fill="#9a3412" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="141" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BAROKAH RASA</text>

  <!-- Circular Texts -->
  <path id="kerupukPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#kerupukPathTop" startOffset="50%" text-anchor="middle">
      KERUPUK &amp; OTAK-OTAK IKAN
    </textPath>
  </text>
  <path id="kerupukPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#kerupukPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU LAMONGAN ★
    </textPath>
  </text>
</svg>
