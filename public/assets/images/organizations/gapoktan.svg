<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gapoktanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="gapoktanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="gapoktanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#gapoktanGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#gapoktanGreen)" stroke="#ffffff" stroke-width="2" />
  <!-- Center White -->
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#gapoktanGold)" stroke-width="2.5" />
  
  <!-- Water & Fishery Pond Waves at Bottom -->
  <path d="M66 112 Q82 106 100 112 Q118 118 134 112 L134 122 Q118 128 100 122 Q82 116 66 122 Z" fill="url(#gapoktanBlue)" />
  <!-- Fish Silhouette -->
  <path d="M112 116 C124 112 128 116 130 114 C128 117 125 119 118 118 Z" fill="#ffffff" />
  
  <!-- Rice Ear / Bulir Padi Mas -->
  <path d="M84 118 C78 95 90 70 100 62" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
  <circle cx="84" cy="105" r="3.5" fill="#eab308" />
  <circle cx="81" cy="95" r="3.5" fill="#eab308" />
  <circle cx="83" cy="85" r="3.5" fill="#eab308" />
  <circle cx="89" cy="75" r="3.5" fill="#eab308" />
  <circle cx="96" cy="67" r="3.5" fill="#eab308" />
  
  <!-- Shrimp / Udang Vaname Tambak Silhouette on Right -->
  <path d="M115 78 C126 84 128 98 120 106 C124 100 122 90 115 85 Z" fill="#ea580c" />
  
  <!-- Banner Gapoktan Sido Makmur -->
  <rect x="64" y="126" width="72" height="18" rx="4" fill="#15803d" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="139" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">GAPOKTAN</text>

  <!-- Circular Text -->
  <path id="gapoktanPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9.5" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#gapoktanPathTop" startOffset="50%" text-anchor="middle">
      KELOMPOK TANI &amp; PEMBUDIDAYA IKAN
    </textPath>
  </text>
  <path id="gapoktanPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#fef08a" letter-spacing="1.5">
    <textPath href="#gapoktanPathBottom" startOffset="50%" text-anchor="middle">
      ★ SIDO MAKMUR KARANGWUNGU ★
    </textPath>
  </text>
</svg>