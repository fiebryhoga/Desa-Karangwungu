<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="fishGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="oceanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="aquaWaves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#fishGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#oceanBlue)" stroke="#ffffff" stroke-width="2" />
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#fishGold)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="62" fill="#f0f9ff" />

  <!-- Water Waves in Background -->
  <path d="M55 110 Q75 102 100 110 Q125 118 145 110 L145 125 L55 125 Z" fill="url(#aquaWaves)" opacity="0.4" />

  <!-- Leaping Bandeng Fish Silhouette -->
  <path d="M68 98 C82 82 105 80 128 88 C135 90 142 98 135 104 C120 108 100 104 84 108 C76 110 70 106 68 98 Z" fill="#0369a1" stroke="#0284c7" stroke-width="1.5" />
  <!-- Fish Tail -->
  <path d="M68 98 L56 90 L62 99 L55 108 Z" fill="#0284c7" />
  <!-- Fish Eye & Fin -->
  <circle cx="128" cy="94" r="2.5" fill="#facc15" />
  <path d="M96 98 L104 106 L94 104 Z" fill="#0ea5e9" />

  <!-- Shrimp / Udang Silhouette -->
  <path d="M102 112 C116 115 128 110 134 102 C138 98 136 108 128 116 C118 122 106 120 100 116 Z" fill="#ea580c" />

  <!-- Ribbon / Banner -->
  <rect x="52" y="128" width="96" height="18" rx="4" fill="#0c4a6e" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="141" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MINA MAKMUR</text>

  <!-- Circular Texts -->
  <path id="fishPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#fishPathTop" startOffset="50%" text-anchor="middle">
      BUDIDAYA BANDENG &amp; UDANG
    </textPath>
  </text>
  <path id="fishPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#fishPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU LAMONGAN ★
    </textPath>
  </text>
</svg>
