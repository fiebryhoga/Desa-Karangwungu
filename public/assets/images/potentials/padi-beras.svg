<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="padiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="padiGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#padiGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#padiGreen)" stroke="#ffffff" stroke-width="2" />
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#padiGold)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="62" fill="#f0fdf4" />

  <!-- Rice Ear Stalk -->
  <path d="M100 125 C95 105 92 85 108 68" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="94" cy="115" rx="5" ry="3" fill="#eab308" transform="rotate(-30 94 115)" />
  <ellipse cx="106" cy="110" rx="5" ry="3" fill="#eab308" transform="rotate(30 106 110)" />
  <ellipse cx="92" cy="102" rx="5" ry="3" fill="#eab308" transform="rotate(-35 92 102)" />
  <ellipse cx="106" cy="98" rx="5" ry="3" fill="#eab308" transform="rotate(35 106 98)" />
  <ellipse cx="93" cy="88" rx="5" ry="3" fill="#eab308" transform="rotate(-40 93 88)" />
  <ellipse cx="107" cy="85" rx="5" ry="3" fill="#eab308" transform="rotate(40 107 85)" />
  <ellipse cx="98" cy="76" rx="5" ry="3" fill="#eab308" transform="rotate(-20 98 76)" />
  <ellipse cx="108" cy="72" rx="4" ry="2.5" fill="#eab308" transform="rotate(20 108 72)" />

  <!-- Ribbon / Banner -->
  <rect x="50" y="128" width="100" height="18" rx="4" fill="#14532d" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="141" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SUMBER REJEKI</text>

  <!-- Circular Texts -->
  <path id="padiPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#padiPathTop" startOffset="50%" text-anchor="middle">
      PADI &amp; BERAS ORGANIK
    </textPath>
  </text>
  <path id="padiPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#padiPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU LAMONGAN ★
    </textPath>
  </text>
</svg>
