<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="anyamanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="anyamanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#anyamanGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#anyamanPurple)" stroke="#ffffff" stroke-width="2" />
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#anyamanGold)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="62" fill="#faf5ff" />

  <!-- Woven Mendong Pattern (Interlaced strips) -->
  <rect x="75" y="80" width="10" height="40" rx="2" fill="#d8b4fe" />
  <rect x="95" y="80" width="10" height="40" rx="2" fill="#d8b4fe" />
  <rect x="115" y="80" width="10" height="40" rx="2" fill="#d8b4fe" />
  <rect x="68" y="88" width="64" height="8" rx="2" fill="#a855f7" />
  <rect x="68" y="104" width="64" height="8" rx="2" fill="#a855f7" />

  <!-- Center Flower / Melati Motif -->
  <circle cx="100" cy="100" r="6" fill="#facc15" stroke="#7e22ce" stroke-width="1.5" />

  <!-- Ribbon / Banner -->
  <rect x="48" y="128" width="104" height="18" rx="4" fill="#581c87" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="141" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">KERAJINAN MELATI</text>

  <!-- Circular Texts -->
  <path id="anyamanPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#anyamanPathTop" startOffset="50%" text-anchor="middle">
      KERAJINAN ANYAMAN MENDONG
    </textPath>
  </text>
  <path id="anyamanPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#anyamanPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU LAMONGAN ★
    </textPath>
  </text>
</svg>
