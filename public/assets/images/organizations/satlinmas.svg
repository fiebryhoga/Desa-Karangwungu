<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="linmasGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="linmasGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#linmasGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#linmasGreen)" stroke="#ffffff" stroke-width="2" />
  
  <!-- Inner Shield -->
  <path d="M100 48 Q142 48 142 90 Q142 135 100 156 Q58 135 58 90 Q58 48 100 48 Z" fill="#166534" stroke="url(#linmasGold)" stroke-width="3" />
  
  <!-- Inner Shield White Core -->
  <path d="M100 58 Q132 58 132 90 Q132 126 100 144 Q68 126 68 90 Q68 58 100 58 Z" fill="#ffffff" />
  
  <!-- Golden Star on Top -->
  <polygon points="100,64 103,71 110,71 105,75 107,82 100,78 93,82 95,75 90,71 97,71" fill="#eab308" />

  <!-- Torch & Shield Protection Motif -->
  <rect x="97" y="88" width="6" height="35" fill="#854d0e" rx="2" />
  <path d="M92 88 L108 88 L104 96 L96 96 Z" fill="#ca8a04" />
  <!-- Flame -->
  <path d="M100 76 C94 82 103 86 100 90 C106 85 105 79 100 76 Z" fill="#dc2626" />
  
  <!-- Padi & Kapas Linmas -->
  <path d="M78 124 C72 106 80 92 90 88" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" />
  <path d="M122 124 C128 106 120 92 110 88" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" />

  <!-- LINMAS Ribbon / Banner -->
  <rect x="72" y="120" width="56" height="18" rx="4" fill="#14532d" stroke="#eab308" stroke-width="1.5" />
  <text x="100" y="133" font-family="sans-serif" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">LINMAS</text>

  <!-- Circular Text -->
  <path id="linmasPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#linmasPathTop" startOffset="50%" text-anchor="middle">
      SATUAN PERLINDUNGAN MASYARAKAT
    </textPath>
  </text>
  <path id="linmasPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="10" font-weight="900" fill="#fef08a" letter-spacing="2">
    <textPath href="#linmasPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU ★
    </textPath>
  </text>
</svg>