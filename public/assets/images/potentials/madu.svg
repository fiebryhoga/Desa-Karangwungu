<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="maduGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="maduAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#maduGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#maduAmber)" stroke="#ffffff" stroke-width="2" />
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#maduGold)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="62" fill="#fffbeb" />

  <!-- Honeycomb Hexagons -->
  <polygon points="100,75 110,81 110,92 100,98 90,92 90,81" fill="#fde68a" stroke="#d97706" stroke-width="1.5" />
  <polygon points="85,90 95,96 95,107 85,113 75,107 75,96" fill="#fde68a" stroke="#d97706" stroke-width="1.5" />
  <polygon points="115,90 125,96 125,107 115,113 105,107 105,96" fill="#fde68a" stroke="#d97706" stroke-width="1.5" />

  <!-- Bee / Lebah Klanceng Silhouette -->
  <ellipse cx="100" cy="98" rx="8" ry="12" fill="#451a03" />
  <path d="M92 94 Q80 84 94 88" stroke="#0284c7" stroke-width="1.5" fill="#bae6fd" opacity="0.8" />
  <path d="M108 94 Q120 84 106 88" stroke="#0284c7" stroke-width="1.5" fill="#bae6fd" opacity="0.8" />
  <circle cx="100" cy="85" r="4" fill="#78350f" />
  <!-- Honey Drop -->
  <path d="M100 112 C96 118 104 118 100 112 Z" fill="#d97706" />

  <!-- Ribbon / Banner -->
  <rect x="50" y="128" width="100" height="18" rx="4" fill="#78350f" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="141" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">OMAH KLANCENG</text>

  <!-- Circular Texts -->
  <path id="maduPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#maduPathTop" startOffset="50%" text-anchor="middle">
      MADU MURNI KLANCENG
    </textPath>
  </text>
  <path id="maduPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#maduPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU LAMONGAN ★
    </textPath>
  </text>
</svg>
