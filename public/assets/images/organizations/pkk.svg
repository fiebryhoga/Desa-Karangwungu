<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pkkTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="pkkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Outer Ring Blue -->
  <circle cx="100" cy="100" r="96" fill="#0284c7" />
  <circle cx="100" cy="100" r="88" fill="url(#pkkTeal)" stroke="#fef08a" stroke-width="2" />
  <!-- Center White -->
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
  
  <!-- 5 Petals Lotus / Segi Lima PKK -->
  <polygon points="100,50 145,82 128,135 72,135 55,82" fill="none" stroke="#0d9488" stroke-width="3" />
  
  <!-- Golden Star at Top -->
  <polygon points="100,60 103,67 110,67 105,71 107,78 100,74 93,78 95,71 90,67 97,67" fill="#eab308" />

  <!-- Padi & Kapas Silhouette -->
  <!-- Left Padi -->
  <path d="M68 115 C60 95 70 80 85 75" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
  <circle cx="66" cy="108" r="3" fill="#eab308" />
  <circle cx="64" cy="98" r="3" fill="#eab308" />
  <circle cx="67" cy="88" r="3" fill="#eab308" />
  <circle cx="75" cy="80" r="3" fill="#eab308" />
  
  <!-- Right Kapas -->
  <path d="M132 115 C140 95 130 80 115 75" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
  <circle cx="134" cy="108" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <circle cx="136" cy="98" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <circle cx="133" cy="88" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <circle cx="125" cy="80" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />

  <!-- Central Emblem PKK Letters -->
  <rect x="72" y="92" width="56" height="24" rx="6" fill="#0369a1" />
  <text x="100" y="109" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PKK</text>
  
  <!-- 10 Segi Lingkaran Kecil melambangkan 10 Program Pokok PKK -->
  <circle cx="100" cy="124" r="3" fill="#eab308" />
  <circle cx="90" cy="124" r="2.5" fill="#0d9488" />
  <circle cx="110" cy="124" r="2.5" fill="#0d9488" />

  <!-- Circular Text -->
  <path id="pkkPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1">
    <textPath href="#pkkPathTop" startOffset="50%" text-anchor="middle">
      PEMBERDAYAAN KESEJAHTERAAN KELUARGA
    </textPath>
  </text>
  <path id="pkkPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="11" font-weight="900" fill="#fef08a" letter-spacing="2">
    <textPath href="#pkkPathBottom" startOffset="50%" text-anchor="middle">
      ★ TP-PKK KARANGWUNGU ★
    </textPath>
  </text>
</svg>