<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bebekGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="bebekRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="eggGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="yolkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bebekGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#bebekRed)" stroke="#ffffff" stroke-width="2" />
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#bebekGold)" stroke-width="2.5" />

  <!-- Background Rays inside circle -->
  <circle cx="100" cy="100" r="62" fill="#fffbeb" />

  <!-- Egg Shape Center-Left -->
  <ellipse cx="82" cy="105" rx="22" ry="28" fill="url(#eggGradient)" stroke="#d97706" stroke-width="1.5" />
  <!-- Golden Yolk -->
  <circle cx="82" cy="110" r="12" fill="url(#yolkGradient)" />
  <circle cx="78" cy="106" r="3.5" fill="#ffffff" opacity="0.6" />

  <!-- Stylized Duck / Bebek Silhouette Center-Right -->
  <path d="M102 125 C98 115 104 100 114 96 C112 90 114 80 124 75 C130 72 136 76 138 82 C146 80 152 82 150 86 C144 87 138 88 136 94 C138 106 130 122 115 125 Z" fill="#b91c1c" />
  <circle cx="128" cy="80" r="2.5" fill="#facc15" />
  <!-- Duck Bill -->
  <path d="M136 82 L146 83 L136 86 Z" fill="#f59e0b" />

  <!-- Ribbon / Banner -->
  <rect x="52" y="128" width="96" height="18" rx="4" fill="#7f1d1d" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="141" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BEBEK MAKMUR</text>

  <!-- Circular Texts -->
  <path id="bebekPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#bebekPathTop" startOffset="50%" text-anchor="middle">
      PETERNAKAN BEBEK &amp; UNGGAS
    </textPath>
  </text>
  <path id="bebekPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#bebekPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU LAMONGAN ★
    </textPath>
  </text>
</svg>
