<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lpmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="lpmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#lpmGold)" />
  <circle cx="100" cy="100" r="88" fill="url(#lpmBlue)" stroke="#ffffff" stroke-width="2" />
  <!-- Center White Disc -->
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#lpmGold)" stroke-width="2.5" />
  
  <!-- Cogwheel / Roda Gigi Pembangunan -->
  <circle cx="100" cy="96" r="32" fill="none" stroke="#ca8a04" stroke-width="6" stroke-dasharray="6 4" />
  <circle cx="100" cy="96" r="24" fill="#fef08a" />
  
  <!-- Hands Building / Tangan Gotong Royong -->
  <path d="M82 110 Q100 88 118 110 Q100 120 82 110 Z" fill="#1d4ed8" />
  <!-- Brick / Pembangunan Fisik -->
  <rect x="92" y="82" width="16" height="8" rx="1" fill="#dc2626" stroke="#ffffff" stroke-width="1" />
  <rect x="86" y="90" width="13" height="8" rx="1" fill="#ea580c" stroke="#ffffff" stroke-width="1" />
  <rect x="101" y="90" width="13" height="8" rx="1" fill="#ea580c" stroke="#ffffff" stroke-width="1" />
  
  <!-- Banner LPM -->
  <path d="M66 128 L134 128 L128 142 L72 142 Z" fill="#1e3a8a" stroke="#ca8a04" stroke-width="1.5" />
  <text x="100" y="139" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">LPM</text>

  <!-- Circular Text -->
  <path id="lpmPathTop" d="M 26 100 A 74 74 0 0 1 174 100" fill="none" />
  <text font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#lpmPathTop" startOffset="50%" text-anchor="middle">
      LEMBAGA PEMBERDAYAAN MASYARAKAT
    </textPath>
  </text>
  <path id="lpmPathBottom" d="M 174 100 A 74 74 0 0 1 26 100" fill="none" />
  <text font-family="sans-serif" font-size="10" font-weight="900" fill="#fef08a" letter-spacing="2">
    <textPath href="#lpmPathBottom" startOffset="50%" text-anchor="middle">
      ★ DESA KARANGWUNGU ★
    </textPath>
  </text>
</svg>